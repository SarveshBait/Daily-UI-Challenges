<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <main class="box-container">
        <h1>Credit Card Checkout</h1>

        <form id="checkoutForm">
            <div class="form-group">
                <label for="cardName">Name on Card</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label for="cardNo">Card Number</label>
                <input type="text" name="cardNo" id="cardNo" inputmode="numeric" maxlength="16" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="expirationDate">Expiration Date</label>
                    <input type="month" id="expiryDate" name="expiryDate" required>
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" name="cvv" id="cvvv" inputmode="numeric" maxlength="3" pattern="\d{3}" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">Submit Payment</button>
        </form>

        <div class="confirmation" id="confirmationMsg">
            <i class="fa-solid fa-check" style="color: rgb(68, 182, 24);"></i>
            <h2>Payment Successfull!</h2>
            <p>Your card has been charged. Thank you for your purchase.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
